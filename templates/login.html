<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Salah-e-Waqt — Pi Deployer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #1B5E20, #2E7D32, #388E3C);
      display: flex; align-items: center; justify-content: center;
      font-family: Arial, Helvetica, sans-serif;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      padding: 48px 40px;
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    .logo { width: 90px; margin-bottom: 16px; }
    h1 { font-size: 20px; color: #1B5E20; margin-bottom: 4px; }
    .subtitle { font-size: 13px; color: #888; margin-bottom: 32px; }
    .field { margin-bottom: 16px; text-align: left; }
    label { display: block; font-size: 12px; color: #555; font-weight: bold; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
    input {
      width: 100%; padding: 11px 14px; border: 1.5px solid #e0e0e0;
      border-radius: 8px; font-size: 14px; color: #333;
      transition: border-color 0.2s;
    }
    input:focus { outline: none; border-color: #2E7D32; }
    .error {
      background: #fff3f3; border: 1px solid #f5c6cb;
      color: #c62828; padding: 10px 14px; border-radius: 8px;
      font-size: 13px; margin-bottom: 16px;
    }
    button {
      width: 100%; padding: 13px;
      background: linear-gradient(135deg, #1B5E20, #2E7D32);
      color: #fff; border: none; border-radius: 8px;
      font-size: 15px; font-weight: bold; cursor: pointer;
      transition: opacity 0.2s; margin-top: 8px;
    }
    button:hover { opacity: 0.9; }
    .footer { margin-top: 24px; font-size: 11px; color: #bbb; }
  </style>
</head>
<body>
  <div class="card">
    <img src="/static/logo-email.png" alt="Salah-e-Waqt" class="logo" onerror="this.style.display='none'">
    <h1>Salah-e-Waqt</h1>
    <p class="subtitle">Pi Deployment Portal</p>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST">
      <div class="field">
        <label>Username</label>
        <input type="text" name="username" placeholder="Enter username" autofocus required />
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" name="password" placeholder="Enter password" required />
      </div>
      <button type="submit">Login</button>
    </form>
    <p class="footer">Salah-e-Waqt &mdash; Prayer Timetable Kiosk</p>
  </div>
</body>
</html>
